<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EverSpark Forge</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL AI CREATION SYSTEM</p>
        <h1>EverSpark Forge</h1>
      </div>
      <div class="service-state" aria-live="polite">
        <span id="health-dot" class="dot"></span>
        <span id="health-text">正在检查系统</span>
      </div>
    </header>

    <section class="result-panel" aria-labelledby="result-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">OUTPUT</p>
          <h2 id="result-title">生成结果</h2>
        </div>
        <span id="generation-state" class="state-pill">等待输入</span>
      </div>
      <div id="result-grid" class="result-grid">
        <div class="empty-state">
          <div class="spark">✦</div>
          <p>你的下一次创作会出现在这里</p>
        </div>
      </div>
    </section>

    <section class="composer" aria-labelledby="composer-title">
      <label id="composer-title" for="prompt">描述你想创作的内容</label>
      <textarea id="prompt" rows="4" placeholder="例如：生成一个站在雨中的红发女孩……"></textarea>
      <div class="composer-footer">
        <span class="hint">Ctrl + Enter 发送</span>
        <button id="generate" type="button">开始生成</button>
      </div>
      <p id="error-message" class="error-message" role="alert"></p>
    </section>

    <section class="history-panel" aria-labelledby="history-title">
      <div class="section-heading compact">
        <div>
          <p class="eyebrow">COMFYUI HISTORY</p>
          <h2 id="history-title">近期作品</h2>
        </div>
        <button id="refresh-history" class="secondary" type="button">刷新</button>
      </div>
      <div id="history-grid" class="history-grid">
        <p class="muted">正在读取ComfyUI历史……</p>
      </div>
    </section>
  </main>

  <dialog id="viewer">
    <button id="close-viewer" class="viewer-close" type="button" aria-label="关闭">×</button>
    <img id="viewer-image" alt="生成作品原图">
  </dialog>
  <script src="/static/app.js" defer></script>
</body>
</html>
